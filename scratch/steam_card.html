<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: linear-gradient(145deg, #0d121a 0%, #171a21 40%, #1b2838 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .glow {
    position: absolute;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(102, 192, 244, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .steam-logo {
    width: 270px;
    height: 270px;
    filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
    z-index: 2;
  }
  .steam-text {
    margin-top: 14px;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 12px;
    color: #ffffff;
    text-indent: 12px;
    text-transform: uppercase;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    z-index: 2;
  }
</style>
</head>

  <div class="glow"></div>

</html>
