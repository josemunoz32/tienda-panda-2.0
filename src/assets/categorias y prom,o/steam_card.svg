<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <!-- Fondo oficial Steam: degradado azul oscuro / grafito de Valve -->
    <linearGradient id="steamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e141b"/>
      <stop offset="50%" stop-color="#172535"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="steamGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2a475e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0e141b" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo Rectangular (sin círculos) -->
  <rect width="600" height="375" fill="url(#steamBg)"/>
  <rect width="600" height="375" fill="url(#steamGlow)"/>

  <!-- Logo Oficial Valve Steam centrado y con espaciado óptimo -->
  <g filter="url(#logoShadow)" transform="translate(300, 142) scale(0.62)">
    <path fill="#ffffff" d="M125 -75 c-44 0 -80 36 -80 80 c0 6.6 0.8 13.1 2.3 19.3 l-81.2 118.1 c-5.2 -1.3 -10.6 -2 -16.3 -2 c-29.6 0 -55.4 16.3 -68.9 40.5 l-81.1 -33.7 c-2.3 8.3 -3.6 17.1 -3.6 26.2 c0 16.8 4.2 32.7 11.6 46.6 l96.6 -40.4 c6.2 20.7 25.3 35.8 48 35.8 c27.6 0 50 -22.4 50 -50 c0 -6.1 -1.1 -11.9 -3.1 -17.3 l80.5 -117.1 c6.5 2.1 13.5 3.3 20.8 3.3 c44.1 0 80 -35.9 80 -80 s-35.9 -80.1 -80 -80.1 z m0 33.3 c25.8 0 46.7 20.9 46.7 46.7 s-20.9 46.7 -46.7 46.7 -46.7 -20.9 -46.7 -46.7 s20.9 -46.7 46.7 -46.7 z m-188.6 238.2 c-13.8 0 -25 11.2 -25 25 s11.2 25 25 25 s25 -11.2 25 -25 s-11.2 -25 -25 -25 z"/>
  </g>

  <!-- Tipografía Oficial STEAM -->
  <text x="300" y="318" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="12" fill="#ffffff" opacity="0.95">STEAM</text>
</svg>
